# .sdlc/config.yml — generated by `sdlc init` (spec v3 H.1)
tiers:
  cheap:
    - provider: openai
      model: gpt-4o-mini
      reasoningEffort: low
      maxTokens: 8192
  base:
    - provider: openai
      model: gpt-4o
    - provider: anthropic
      model: claude-sonnet-4
  elevated:
    - provider: anthropic
      model: claude-opus-4
    - provider: openai
      model: o3
pricing:
  openai/gpt-4o-mini:
    input: 0.15
    output: 0.6
  openai/gpt-4o:
    input: 2.5
    output: 10
  openai/o3:
    input: 10
    output: 40
  anthropic/claude-sonnet-4:
    input: 3
    output: 15
  anthropic/claude-opus-4:
    input: 15
    output: 75
execution:
  workerMode: process
  maxParallelWorkers: auto
  maxParallelE2e: 2
  basePort: 4100
  worktreeRetentionDays: 7
  bootstrapTimeoutMs: 600000
  dependencyCache: true
  workerEnvKeys: []
  egress:
    mode: allowlist
    hosts:
      - registry.npmjs.org
      - pypi.org
      - files.pythonhosted.org
  bootstrapCommands:
    - npm
    - ci
budgets:
  perTask:
    R1:
      maxAttempts: 2
      maxDurationMs: 1800000
      maxCostUsd: 2
      maxTokens: 200000
    R2:
      maxAttempts: 3
      maxDurationMs: 3600000
      maxCostUsd: 5
      maxTokens: 400000
    R3:
      maxAttempts: 3
      maxDurationMs: 7200000
      maxCostUsd: 15
      maxTokens: 1000000
    R4:
      maxAttempts: 4
      maxDurationMs: 14400000
      maxCostUsd: 50
      maxTokens: 3000000
  perProject:
    maxCostUsd: 200
    maxDurationMs: 86400000
    maxParallelWorkers: auto
verification:
  gateTimeoutMs: 300000
  retryFailedGate: 1
  visualViewports:
    - 1440x900
    - 1024x768
    - 390x844
  visualFullMatrix: auto
  a11yFloor: true
  gates:
    syntax:
      command:
        - node
        - "--check"
        - "{file}"
      scope: changed-files
    lint:
      command:
        - "true"
      skipIf:
        - not-configured
    unit:
      command:
        - npm
        - test
      timeoutMs: 900000
    integration:
      command:
        - npm
        - test
      timeoutMs: 1800000
    build:
      command:
        - npm
        - run
        - build
      skipIf: []
  detection: auto
  skipWhen:
    no-browser-stack:
      - e2e
      - visual
escalation:
  loopThreshold: 2
  maxFailedAttempts: 3
  visualFailureThreshold: 2
  collaborativeTriggers:
    - architecture_dispute
    - security_r4
    - elevated_double_fail
    - major_refactor
context:
  tokenBudget: 24000
  maxLinesPerFile: 200
  truncationPriority:
    - 4
    - 5
    - 7
storage:
  dbPath: .sdlc/sdlc.db
  fallbackChain:
    - node-sqlite
    - better-sqlite3
    - storage-domain
  requireQuickCheckOnOpen: true
safety:
  instanceLock: true
  orchestratorPaths:
    - .sdlc/**
    - .dsh/**
  guardForbiddenPatterns:
    - git push --force*
    - rm -rf /
    - git clean -fdx*
  guardMode: deny
router:
  historyWindow: 1000
  laplaceSmoothing: true
  tieBreak: cost
observability:
  logLevel: info
  eventLog: true
  metricsExport: false
