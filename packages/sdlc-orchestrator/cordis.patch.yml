# sdlc-orchestrator — lead-profile meta-bundle (the ONE spec the lead installs).
#
# GENERATED FILE — do not edit by hand.
# Regenerate with:  node scripts/gen-bundle-patch.mjs
#
# The DSH loader mounts exactly the bundles listed in `dsh.profile.bundles` and
# loads each one's OWN `dsh.bundle.patch`; it does not follow a bundle's
# `dependencies`. So this package — the single spec the lead profile installs —
# must declare the whole lead composition itself. Below is the union of its four
# members' rows, concatenated by the generator (the presets member is filtered
# to the public role presets):
#
#   @patwoodman/dsh-sdlc-flow-core     host services (spec v3 C.2)
#   @patwoodman/dsh-sdlc-flow-tools    model tools + the /sdlc command surface (C.4)
#   @patwoodman/dsh-sdlc-flow-presets  role compositions; only the lead is a selectable preset (C.3)
#   @patwoodman/dsh-sdlc-flow-ui       the web UI + host routes (C.1)
#
# The members keep declaring their own `dsh.bundle.patch` because the worker and
# probe profiles mount them as bundles directly (`profiles/*/profile.json`).
# They are never listed as bundles in the lead profile: in the lead they are
# plain module dependencies, present so the row names below resolve. Listing
# them there as well would compose every row twice.
#
# Order matters only where a row waits on a service: services first, then the
# tools and preset rows that use them, then the UI. The
# `agent-preset-registry` row stays FIRST inside the presets member block
# (headless/sdk, the dialect has no insert-if-missing). This generated lead
# patch replaces that insert with an id-targeted override of the web template's
# shipped row: a duplicate id+name is loader-accepted but blocks plugin-manager
# uninstall. M0-02 pins one registry row whose default is sdlc-lead.
#
# The lead profile is the interactive DSH surface, so it publishes ONLY the
# public role presets (currently the lead). The other role compositions remain
# in the member patch for the headless probe and programmatic mounting; they
# are not selectable options in the user's preset picker.

# ── the meta-bundle's own row ────────────────────────────────────────────────
# A row that executes this package's apply() at boot, so the meta-bundle is a
# real loader layer rather than data alone (the sdlc-ui self-report pattern).
- insert:
    - id: sdlc-orchestrator
      name: '@patwoodman/dsh-sdlc-flow'
      config: {}

# ── from @patwoodman/dsh-sdlc-flow-core — host services (spec v3 C.2)
- insert:
    - id: sdlc-tasks
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: tasks
    - id: sdlc-scheduler
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: scheduler
    - id: sdlc-router
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: router
    - id: sdlc-verifier
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: verifier
    - id: sdlc-integration
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: integration
    - id: sdlc-evidence
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: evidence
    - id: sdlc-escalation
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: escalation
    - id: sdlc-worker-mgr
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: worker-mgr
    - id: sdlc-recovery
      name: '@patwoodman/dsh-sdlc-flow/services'
      config:
        service: recovery

# ── from @patwoodman/dsh-sdlc-flow-tools — model tools + the /sdlc command surface (C.4)
- insert:
    - id: sdlc-tools
      name: '@patwoodman/dsh-sdlc-flow/tools-plugin'
      config:
        tools: []
        worktreePath: !!js process.cwd()

# ── from @patwoodman/dsh-sdlc-flow-presets — role compositions; only the lead is a selectable preset (C.3)
# The web template ships agent-preset-registry. Override its default instead
# of inserting a duplicate row: a duplicate id+name is loader-accepted but
# blocks plugin-manager uninstall as "bundle-in-use". The presets member keeps
# the insert for headless/sdk templates, which have no registry row.
- id: agent-preset-registry
  name: '@deepseek-ai/dsh-agent-preset-registry'
  config:
    default: sdlc-lead

- insert:
    - id: preset-sdlc-lead
      name: "@deepseek-ai/dsh-agent-preset"
      config:
        id: sdlc-lead
        name: Lead Orchestrator
        description: Owns decomposition, delegation and the decision ledger; the only role that talks to the user.
        order: 10
        plugins:
          - id: persona
            name: "@deepseek-ai/dsh-persona"
            config:
              prefix: "You are the Lead Orchestrator on an SDLC task team.\n\nMission: Decomposition, delegation, plan deltas, decision ledger, final reporting.\n\nYou work on exactly one task at a time under a task contract that names the paths you may change.\nStay inside the contract. If the task is wrong, say so and request a decision — do not widen scope.\n\nVerification policy: you may not accept your own work; the runtime derives files_changed from git and re-runs every gate.\nEscalation policy: if you need a decision or a missing dependency, call sdlc_request_decision; never guess and never widen scope.\nAuthority: you hold no authority to approve, release, or merge. Anything that grants authority is a human decision."
              suffix: "Model: {{model}}."
          - id: tool-bash
            name: "@deepseek-ai/dsh-tool-bash"
          - id: tool-fs
            name: "@deepseek-ai/dsh-tool-fs"
          - id: tool-todo
            name: "@deepseek-ai/dsh-tool-todo"
            config:
              allowParallelInProgress: true
          - id: sdlc-report
            name: "@patwoodman/dsh-sdlc-flow/tools-report"
          - id: tool-subagent
            name: "@deepseek-ai/dsh-tool-subagent"
            config:
              provider: spawn
              toolName: subagent
              backgroundMode: continuable
          - id: sdlc-dispatch
            name: "@patwoodman/dsh-sdlc-flow/tools-dispatch"
          - id: sdlc-plan
            name: "@patwoodman/dsh-sdlc-flow/tools-plan"
    - id: sdlc-presets
      name: "@patwoodman/dsh-sdlc-flow/presets-plugin"
      config: {}

# ── from @patwoodman/dsh-sdlc-flow-ui — the web UI + host routes (C.1)
- insert:
    - id: sdlc-ui
      name: '@patwoodman/dsh-sdlc-flow/ui'
      config:
        autoOpen: true
