<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC Demo — Tasks</title>
<style>
  :root { color-scheme: light dark; --accent: #2563eb; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  h1 { font-size: 1.4rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input[type=text] { flex: 1; padding: .5rem; font-size: 1rem; }
  button { padding: .5rem 1rem; font-size: 1rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; gap: .5rem; align-items: center; padding: .4rem 0; border-bottom: 1px solid #8884; }
  li.done span { text-decoration: line-through; opacity: .6; }
  #status { min-height: 1.4em; color: #b00; }
  [aria-live] { font-size: .9rem; }
</style>
</head>
<body>
<h1>Tasks</h1>
<div id="status" role="alert" aria-live="assertive"></div>
<form id="add" aria-label="Add a task">
  <label for="title" class="sr-only" style="position:absolute;left:-9999px">Task title</label>
  <input id="title" name="title" type="text" placeholder="What needs doing?" autocomplete="off" required maxlength="200">
  <button type="submit">Add</button>
</form>
<p id="empty" hidden>No tasks yet — add the first one above.</p>
<ul id="list" aria-live="polite"></ul>
<script src="/app.js"></script>
</body>
</html>
