name: CI

# Spec v3 G.5, corrected (errata E10):
#   - the DSH runtime is INSTALLED before any `dsh plugin` step (v2 omitted it);
#   - pnpm is pinned via pnpm/action-setup;
#   - testcontainers is gone — `node:test` is the only runner and isolation comes
#     from the deterministic sdlc-mock-llm provider;
#   - gate:P and gate:M0 need no model and no network; M1..M8 are deterministic
#     and use the mock provider (never a real API call).

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.sdlc/TEST_SUITE_ANALYSIS_REPORT.md'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.sdlc/TEST_SUITE_ANALYSIS_REPORT.md'

env:
  DSH_VERSION: 0.2.0-rc.2

jobs:
  # TRACK B, B13: ONE build job. Before B13 every job re-ran checkout +
  # build (5 identical src/→lib/ rebuilds per push); now `build` compiles once
  # and uploads lib/ + the workspace links as an artifact that the gate jobs
  # download. pnpm's store and the pinned DSH install are cached so repeated
  # pushes only pay for changed work. Job NAMES are unchanged (release.yml
  # gates on this workflow's success for the same commit — see the commit-status
  # poll there — so renaming would silently break the release gate).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      # No version key here: the version lives in package.json's
      # packageManager field, and specifying both makes pnpm/action-setup
      # fail with Multiple versions of pnpm specified.
      - uses: pnpm/action-setup@v4
      - name: cache the pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs
      - name: install the pinned DSH runtime
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@$DSH_VERSION
          runtime="$(npm root -g)/@deepseek-ai/dsh"
          test -f "$runtime/node_modules/@deepseek-ai/dsh-agent-preset-registry/lib/index.js"
          echo "SDLC_VERIFY_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: build (zero-dependency src → lib, incl. UI bundle)
        run: node scripts/build.mjs && node scripts/build-ui.mjs && node scripts/fold-meta.mjs
      - name: upload the built tree (lib/ + workspace links manifest)
        uses: actions/upload-artifact@v4
        with:
          name: built-tree
          path: |
            packages/*/lib/
            scripts/lib/
            tests/lib/
            eval/lib/
            node_modules/
            !node_modules/.cache/
  unit:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: pnpm/action-setup@v4
      - name: download the built tree
        uses: actions/download-artifact@v4
        with:
          name: built-tree
      # lib/ uses bare cross-package imports (@patwoodman/dsh-sdlc-flow-core, …),
      # which need node_modules to resolve. A fresh checkout has none, so every
      # suite importing such a lib/ file failed on CI while passing locally.
      # The artifact carries the linked tree; re-run the linker as a
      # fail-closed check that the links resolve on this runner.
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs --check
      - name: presets are in sync with roles.js
        run: node scripts/gen-presets.mjs --check
      - name: the meta-bundle patch is in sync with its members
        run: node scripts/gen-bundle-patch.mjs --check
      - name: every package version matches the root
        run: node scripts/bump-version.mjs --check
      - name: npm repository metadata is complete (registry page, npm repo, provenance)
        run: node scripts/set-repository.mjs --check
      - name: UI bundle is in sync with client sources
        run: node scripts/build-ui.mjs --check
      - name: unit tests (L2)
        run: npm run test:unit
      - name: contract tests (L3)
        run: npm run test:contract

  gate-platform:
    needs: [build, unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: download the built tree
        uses: actions/download-artifact@v4
        with:
          name: built-tree
      # Every job installs its own DSH (hermetic, no cross-job cache):
      # the gate jobs boot the live host, so a missing binary fails them
      # with `dsh not on PATH` instead of silently skipping.
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs --check
      - name: install the pinned DSH runtime (gate:P probes the live host)
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@$DSH_VERSION
          test -f "$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-agent-preset-registry/lib/index.js"
      - name: gate:P — deterministic platform facts (no model, no network)
        run: node scripts/validate-platform.mjs --json .validation/gate-P.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-evidence
          path: .validation/

  gate-m0:
    needs: gate-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      # No version key here: the version lives in package.json's
      # packageManager field, and specifying both makes pnpm/action-setup
      # fail with Multiple versions of pnpm specified.
      - uses: pnpm/action-setup@v4
      - name: download the built tree
        uses: actions/download-artifact@v4
        with:
          name: built-tree
      # lib/ resolves cross-package imports through node_modules; a fresh
      # checkout has none. Without this the linked member deps have no
      # node_modules entries and the live boot probe fails its imports
      # (M0-03/M0-04/M0-12), even though every offline test passes.
      # The artifact carries the linked tree; re-check rather than rebuild.
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs --check
      - name: install the pinned DSH runtime (M0 boots the probe profile)
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@$DSH_VERSION
          test -f "$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-agent-preset-registry/lib/index.js"
      - name: install profiles + bundles
        run: node scripts/install-local.mjs --yes --skip-build
      - name: gate:M0 — composition + boot hook + guard + schema
        run: node scripts/validate-m0.mjs --json .validation/gate-M0.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-evidence
          path: .validation/

  gates:
    needs: gate-m0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: download the built tree
        uses: actions/download-artifact@v4
        with:
          name: built-tree
      - name: install the real host for mandatory runtime verification
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@$DSH_VERSION
          runtime="$(npm root -g)/@deepseek-ai/dsh"
          test -f "$runtime/node_modules/@deepseek-ai/dsh-agent-preset-registry/lib/index.js"
          echo "SDLC_VERIFY_RUNTIME=$runtime" >> "$GITHUB_ENV"
      # Same workspace-link requirement as gate-m0: M1..M8 resolve
      # cross-package lib/ imports through node_modules.
      # The artifact carries the linked tree; re-check rather than rebuild.
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs --check
      - name: verify all shipped presets and scoped tool execution on the real host
        run: node scripts/verify-tool-runtime.mjs "${SDLC_VERIFY_RUNTIME:?}"
      - name: integration + fault + adversarial layers (L4–L6)
        run: |
          npm run test:integration
          npm run test:fault
          npm run test:adversarial
      - name: gate:P → gate:M8, stopping at the first failure
        run: node scripts/validate-gates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestone-evidence
          path: .validation/

  e2e:
    needs: gates
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - name: download the built tree
        uses: actions/download-artifact@v4
        with:
          name: built-tree
      # e2e imports lib/ cross-package modules (mock LLM, core) through
      # node_modules, same as every other job.
      # The artifact carries the linked tree; re-check rather than rebuild.
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs --check
      - name: the eight §53 acceptance tests (mock provider, no cost)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: .validation/

  # The two install paths a user can actually take, from a clean slate.
  # This is the job that would have caught every beta.9–beta.13 failure
  # class before it reached npm:
  #   - the tarball path (./install.sh from a staged no-clone artifact);
  #   - the registry path (dsh plugin add of the PACKED tarballs, i.e. the
  #     exact files npm would ship — lib/ only, no src/, no build scripts).
  # A tag that cannot be installed from scratch never reaches the Release
  # workflow's publish step (release.yml gates on this job's success).
  install-smoke:
    needs: e2e
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: 0.2.0-rc.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - uses: pnpm/action-setup@v4
      # M0-00 (PLAT-05/06/07/…) asserts a working `dsh` on PATH: the tarball
      # install below proves profiles install into a DSH home, but dsh itself
      # must be installed first (v1.1.1 did this inline; B13's single-build
      # rework dropped it and every M0-00 check failed with `dsh not on PATH`).
      - name: install the pinned DSH runtime
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@$DSH_VERSION
          test -f "$(npm root -g)/@deepseek-ai/dsh/node_modules/@deepseek-ai/dsh-agent-preset-registry/lib/index.js"
      - name: download the built tree
        uses: actions/download-artifact@v4
        with:
          name: built-tree
      # install-smoke rebuilds the tarball from source by design (it ships
      # build-release.mjs output), so it keeps its own build; the downloaded
      # tree only skips the redundant workspace link step's rebuild.
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs --check
      - name: build the no-clone tarball
        run: node scripts/build-release.mjs
      - name: smoke 1/2 — tarball install from scratch
        # doctor's two environment errors (no provider credentials on a
        # clean runner; unpack dir is not a git repo) are EXPECTED here —
        # they describe the sandbox, not the install. What must hold: the
        # install itself completes, the profiles exist, and the M0 gate is
        # green. M0 is asserted explicitly below; doctor runs with its two
        # environment checks demoted so a healthy install is green.
        run: |
          set -euo pipefail
          rm -rf "$HOME/.dsh-test-smoke" /tmp/smoke-tarball
          mkdir -p /tmp/smoke-tarball
          tar xzf dist/dsh-sdlc-beta.tgz -C /tmp/smoke-tarball
          cd /tmp/smoke-tarball/dsh-sdlc-*/
          DSH_HOME="$HOME/.dsh-test-smoke" ./install.sh
          DSH_HOME="$HOME/.dsh-test-smoke" node scripts/doctor.mjs --allow-no-credentials --allow-no-repo
          DSH_HOME="$HOME/.dsh-test-smoke" node scripts/validate-m0.mjs
      - name: smoke 2/2 — registry-shape install (packed lib/ only)
        # npm pack stages exactly `files` (lib/, never src/ or build.cjs),
        # so installing the packed tarballs proves the published packages
        # resolve their row modules with no build step — the beta.10
        # prepack-ENOENT class and the unfolded-fold class both fail here.
        run: |
          set -euo pipefail
          rm -rf /tmp/smoke-pack && mkdir -p /tmp/smoke-pack
          for dir in packages/*/; do
            ( cd "$dir" && npm pack --ignore-scripts --pack-destination /tmp/smoke-pack >/dev/null )
          done
          ls /tmp/smoke-pack/*.tgz
          # Every packed tarball must contain its loader entry points and no src/.
          # NOTE: list each tarball to a file first — `tar tzf | grep -q`
          # lets grep exit on first match, SIGPIPE-killing tar, which fails
          # the step under `set -o pipefail` (observed on the first smoke
          # run: "tar: stdout: write error").
          for tgz in /tmp/smoke-pack/*.tgz; do
            tar tzf "$tgz" > /tmp/smoke-pack/contents.txt
            if grep -q '^package/src/' /tmp/smoke-pack/contents.txt; then
              echo "::error::packed $tgz contains src/ (unpublished at install time)"
              exit 1
            fi
          done
          for f in lib/index.js lib/plugin.js lib/roles.js lib/cli.mjs lib/client.js; do
            found=0
            for tgz in /tmp/smoke-pack/*.tgz; do
              tar tzf "$tgz" > /tmp/smoke-pack/contents.txt
              if grep -q "package/$f\$" /tmp/smoke-pack/contents.txt; then found=1; break; fi
            done
            if [ "$found" = "0" ]; then
              echo "::error::no packed tarball provides $f"
              exit 1
            fi
          done
          echo "packed-shape OK: $(ls /tmp/smoke-pack/*.tgz | wc -l) tarballs, lib/ only"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-evidence
          path: dist/*.tgz

  # L8 — live. Manual only, costs money, never runs automatically.
  e2e-live:
    needs: install-smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
      - run: node scripts/build.mjs && node scripts/build-ui.mjs && node scripts/fold-meta.mjs
      - run: npm run test:e2e-live
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
