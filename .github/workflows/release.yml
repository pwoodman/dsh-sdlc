name: Release

# Cuts a release: verifies the tree, builds the no-clone tarball, attaches
# it to a GitHub Release, and — when the repository variable PUBLISH_NPM is true
# and an NPM_TOKEN secret exists — publishes the packages so
# `dsh plugin --profile sdlc-web add @patwoodman/dsh-sdlc-flow` works exactly like
# dsh-context / dsh-proactive.
#
# SAFETY MODEL (why a broken tree can never reach npm):
#   1. This workflow only runs for tags, and every tag push also triggers CI.
#      The publish step is gated on the CI workflow's full success for THIS
#      commit (commit-status check below): unit → gate-platform → gate-m0 →
#      gates (M1–M8) → e2e → install-smoke (tarball install + packed-shape).
#      A tag pushed on a red tree waits instead of publishing.
#   2. This job re-runs the same gates itself (offline tests + P→M8+Q) so a
#      re-run months later cannot publish a tree that no longer passes.
#   3. Before publishing, verify-publish.mjs installs the PACKED tarballs
#      (the exact files npm would ship) into scratch profiles and boots the
#      probe — the beta.10 prepack-ENOENT class fails here, not on users.
#   4. npm provenance ties each tarball to this repo + workflow; the registry
#      shows the build that produced it.
#
#   node scripts/set-scope.mjs @your-npm-username   # once, if you do not own the scope
#   git tag v0.4.0-beta.17 && git push origin v0.4.0-beta.17
#
# The tag must match package.json's version (checked below), so the release name,
# the tarball name and the npm versions can never drift apart.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release and upload assets
  actions: read # inspect the CI workflow's conclusion for this commit
  checks: read # inspect this commit's check runs
  id-token: write # npm provenance (sigstore signing of each publish)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DSH_VERSION: 0.2.0-rc.2
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          registry-url: 'https://registry.npmjs.org'

      # No `version:` here: the version lives in package.json's `packageManager`
      # field, and specifying both makes pnpm/action-setup fail with
      # "Multiple versions of pnpm specified" (observed on the first real tag).
      - uses: pnpm/action-setup@v4

      - name: install the DSH runtime (needed by gate:P and gate:M0)
        run: |
          set -euo pipefail
          npm install -g @deepseek-ai/dsh@$DSH_VERSION
          runtime="$(npm root -g)/@deepseek-ai/dsh"
          test -f "$runtime/node_modules/@deepseek-ai/dsh-agent-preset-registry/lib/index.js"
          echo "SDLC_VERIFY_RUNTIME=$runtime" >> "$GITHUB_ENV"

      # lib/ resolves cross-package imports through node_modules; a fresh
      # checkout has none (this is what failed the beta.6–beta.8 releases).
      - name: link the workspace packages into node_modules
        run: node scripts/link-workspace.mjs

      - name: the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag v$tag does not match package.json version $version"
            exit 1
          fi
          node scripts/bump-version.mjs --check

      # A version already on npm or already tagged makes the publish loop skip
      # every package and still report success. Fail before building anything.
      - name: the release version is unpublished and documented
        run: node scripts/verify-release.mjs --allow-current-tag --json

      - name: build the release tarball (also regenerates patches and lib/)
        run: node scripts/build-release.mjs

      - name: verify all shipped presets and scoped tool execution on the real host
        run: node scripts/verify-tool-runtime.mjs "${SDLC_VERIFY_RUNTIME:?}"

      - name: offline test suite
        run: npm test

      - name: gates P and M0–M8 plus coverage
        run: node scripts/validate-gates.mjs

      # Gate 1: CI must be fully green for THIS commit. A tag pushed on a red
      # tree (or while CI is still running) waits here instead of publishing.
      # Polls the CI workflow's conclusion for this exact SHA; fails closed on
      # timeout or on any conclusion other than success.
      - name: wait for CI green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          echo "waiting for CI success on $sha (up to 40 min)"
          for i in $(seq 1 80); do
            status="$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
              --jq '[.check_runs[] | select(.name | startswith("CI") or . == "CI") | .conclusion] | unique | join(",")')"
            # Fall back to workflow-run conclusions when check-runs are absent.
            if [ -z "$status" ] || [ "$status" = "null" ]; then
              status="$(gh run list --commit "$sha" --workflow CI --json conclusion \
                --jq '[.[].conclusion] | unique | join(",")')"
            fi
            echo "attempt $i: CI conclusions for $sha: ${status:-<none yet>}"
            case ",$status," in
              *,failure,*|*,cancelled,*|*,timed_out,*|*,action_required,*|*,stale,*)
                echo "::error::CI is not green for $sha ($status) — refusing to publish"
                exit 1
                ;;
              *,success,*)
                # success present and no failure state alongside it
                if [ "$status" = "success" ]; then
                  echo "CI green for $sha"
                  exit 0
                fi
                ;;
            esac
            sleep 30
          done
          echo "::error::timed out waiting for CI on $sha"
          exit 1

      - name: keep the evidence bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation
          path: .validation/

      - name: keep the tarball
        uses: actions/upload-artifact@v4
        with:
          name: dsh-sdlc-beta
          path: dist/*.tgz

      # Verify before EITHER public promotion: GitHub Release or npm publish.
      - name: verify the packed tarballs install and boot
        run: node scripts/verify-publish.mjs

      - name: publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
          # NOT a GitHub "prerelease", deliberately. `releases/latest` skips
          # prereleases, and the whole point of this artifact is the stable
          # one-command URL below — marking it prerelease made that URL 404 for
          # every tester (verified: /releases/latest/... 404, /releases/download/
          # vX/... 200). The version string already says `beta`, and npm keeps its
          # own `beta` dist-tag, so nothing is promoted by accident.
          prerelease: false
          body: |
            **Beta installer - no clone, no build:**

            ```sh
            curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/dsh-sdlc-beta.tgz
            tar xzf dsh-sdlc-beta.tgz && cd dsh-sdlc-*/
            ./install.sh
            ```

            That creates the `sdlc-web`, `sdlc-worker` and `sdlc-probe` profiles,
            installs the bundles, verifies the composed lead and runs the `M0`
            gate. It needs `dsh` and `pnpm` on `PATH` and Node >= 22.5, and it is
            idempotent - re-run it any time. Then start the lead with:

            ```sh
            dsh --profile sdlc-web
            ```

            When the npm packages are published for this tag, the registry and
            **Add plugin** forms work too; the meta-bundle package name is in the
            Install section of the repository README.

            Known beta limits are in CHANGELOG.md.

      # Publishing is opt-in and skipped (never failed) when unconfigured: the
      # tarball above is a complete install path on its own. Enable it with the
      # repository variable PUBLISH_NPM=true plus the NPM_TOKEN secret.
      - name: publish to npm
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true' && env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          export NODE_AUTH_TOKEN="$NPM_TOKEN"
          version="$(node -p "require('./package.json').version")"
          # A prerelease must never take the `latest` dist-tag: `npm install
          # @patwoodman/dsh-sdlc-flow` would then hand a beta to everyone. Betas
          # publish under `beta`; only a stable version moves `latest`.
          case "$version" in
            *-*) dist_tag=beta ;;
            *)   dist_tag=latest ;;
          esac
          echo "publishing $version under the $dist_tag dist-tag"
          # Dependency order: the meta-bundle is published last.
          for dir in sdlc-guard sdlc-core sdlc-cli sdlc-tools sdlc-presets sdlc-client-ui sdlc-orchestrator; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            private="$(node -p "Boolean(require('./packages/$dir/package.json').private)")"
            if [ "$private" = "true" ]; then
              echo "skip $name (private)"; continue
            fi
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"; continue
            fi
            echo "publishing $name@$version"
            # prepack/prepare must not run here: `files` ships lib/ only, so a
            # lifecycle script that rebuilds from src/ fails inside npm's pack
            # (ENOENT build.cjs) and, with `set -e` swallowed by a subshell
            # mistake, the loop used to continue and leave the worker packages
            # unpublished. `--ignore-scripts` packs the built lib/ as-is.
            # `--provenance` ties the tarball to this repo + workflow (needs
            # id-token:write, granted above); it is a no-op for registries
            # that do not support it and fails closed here if signing fails.
            ( cd "packages/$dir" && npm publish --access public --tag "$dist_tag" --ignore-scripts --provenance )
          done
          # Post-publish proof: every member resolves at the published version.
          # npm replicates publishes across its CDN, so a freshly published
          # version can 404 for a few minutes (observed on beta.17: 6/7
          # members published, then the verification read hit a cold replica
          # and failed the step). Poll each member with backoff instead of
          # reading once — a version that never appears still fails closed.
          for dir in sdlc-guard sdlc-core sdlc-cli sdlc-tools sdlc-presets sdlc-client-ui sdlc-orchestrator; do
            name="$(node -p "require('./packages/$dir/package.json').name")"
            private="$(node -p "Boolean(require('./packages/$dir/package.json').private)")"
            if [ "$private" = "true" ]; then continue; fi
            seen=""
            for attempt in 1 2 3 4 5 6; do
              seen="$(npm view "$name@$version" version 2>/dev/null || true)"
              if [ "$seen" = "$version" ]; then break; fi
              echo "waiting for $name@$version on the registry (attempt $attempt, saw '${seen:-<nothing>}')"
              sleep 60
            done
            if [ "$seen" != "$version" ]; then
              echo "::error::$name@$version not visible after publish (saw '${seen:-<nothing>}')"
              exit 1
            fi
            echo "verified $name@$seen on the registry"
          done

          # A beta-only package can have a prerelease on `latest` (it did:
          # beta.13), and a plain `dsh plugin add @patwoodman/dsh-sdlc-flow` —
          # exactly what the Desktop Add-plugin field sends — resolves
          # `latest`. If `latest` is itself a prerelease, advance it to this
          # build so the no-version install path can never resolve to an older,
          # known-broken beta. A stable `latest` is never moved down to a beta.
          if [ "$dist_tag" = beta ]; then
            for dir in sdlc-guard sdlc-core sdlc-cli sdlc-tools sdlc-presets sdlc-client-ui sdlc-orchestrator; do
              name="$(node -p "require('./packages/$dir/package.json').name")"
              private="$(node -p "Boolean(require('./packages/$dir/package.json').private)")"
              if [ "$private" = "true" ]; then continue; fi
              current="$(npm view "$name" dist-tags.latest --prefer-online 2>/dev/null || true)"
              case "$current" in
                '')
                  echo "::warning::could not read latest for $name — leaving dist-tags unchanged"
                  continue
                  ;;
                *-*) ;; # prerelease latest: replace it with this newer beta
                *)
                  echo "latest for $name stays $current (stable, never downgraded to a beta)"
                  continue
                  ;;
              esac
              # A historical workflow rerun must never move latest backwards.
              if ! node --input-type=module -e 'import { compare } from "./scripts/lib/semver-lite.mjs"; process.exit(compare(process.argv[1], process.argv[2]) > 0 ? 0 : 1)' "$version" "$current"; then
                echo "latest for $name stays $current (candidate $version is not newer)"
                continue
              fi
              moved=""
              for attempt in 1 2 3 4 5; do
                if npm dist-tag add "$name@$version" latest >/dev/null 2>&1; then moved=1; break; fi
                echo "retrying latest for $name (attempt $attempt, currently $current)"
                sleep 30
              done
              if [ "$moved" != 1 ]; then
                echo "::error::could not advance $name latest from $current to $version"
                exit 1
              fi
              # Tag writes may precede refreshed CDN/local cache metadata.
              # Retry reads only; never republish or repeatedly overwrite a tag.
              observed=""
              for attempt in 1 2 3 4 5 6; do
                observed="$(npm view "$name" dist-tags.latest --prefer-online 2>/dev/null || true)"
                if [ "$observed" = "$version" ]; then break; fi
                echo "waiting for $name latest metadata (attempt $attempt, saw '${observed:-<nothing>}')"
                if [ "$attempt" -lt 6 ]; then sleep 30; fi
              done
              if [ "$observed" != "$version" ]; then
                echo "::error::$name latest resolves to $observed, expected $version"
                exit 1
              fi
              echo "latest: $name $current → $observed"
            done
          fi

      # Prove the path a user actually takes, using the published tarball.
      # `npx pkg@version dsh-sdlc-install` was the only failing step on beta.24
      # (exit 127: the command name was resolved before the package bin), while
      # the same install/check/probe/uninstall sequence passes from the packed
      # tarball. Pack explicitly so the smoke does not depend on npx semantics.
      - name: post-publish registry install smoke
        if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_NPM == 'true' && env.NPM_TOKEN != ''
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          pack_dir="$(mktemp -d)"
          npm pack "@patwoodman/dsh-sdlc-flow@$version" --pack-destination "$pack_dir" >/dev/null
          tar xzf "$pack_dir"/*.tgz -C "$pack_dir"
          installer="$pack_dir/package/lib/install.mjs"
          test -f "$installer"
          export DSH_HOME="$(mktemp -d)"
          echo "fresh DSH_HOME: $DSH_HOME"
          node "$installer" --only all --version "$version" --json
          node "$installer" --check --only all --version "$version" --json
          SDLC_SELFTEST="$DSH_HOME/selftest.json" dsh --profile sdlc-probe
          test -s "$DSH_HOME/selftest.json"
          node "$installer" --uninstall --only all --json
          echo "published tarball: install, check, probe boot and uninstall all passed"

      - name: explain an npm refusal
        if: failure() && vars.PUBLISH_NPM == 'true' && env.NPM_TOKEN != ''
        run: |
          echo "::warning::If the publish step failed with 403, the package scope is not one your npm account owns."
          echo "::warning::Sign in to npm (GitHub OAuth works), then either run 'node scripts/set-scope.mjs @your-username' and re-tag, or create a free npm org with the current scope name."
